name: CI
run-name: "Workflow run by ${{ github.actor }}"

env:
  GITHUB_ACTIONS: "true"
  
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    
  workflow_dispatch:

jobs:
  github-task-job:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Display GITHUB_ACTIONS
      run: echo "Value for GITHUB_ACTIONS is ${{ env.GITHUB_ACTIONS }}."
    - name: Display branch and repository
      run: echo "Job executed on ${{ github.ref }} branch and ${{ github.repository }} repository."
    - name: Display event which trigger workflow
      run: echo "Job was triggered by ${{ github.event_name }} event."
